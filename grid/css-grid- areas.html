<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css-grid-areas</title>

<style>
    .page-layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-areas:
              "header header"
              "sidebar main"
              "footer footer";
            gap: 16px;
          }

          .header {
            grid-area: header;
            background-color: brown;
            padding: 2rem;
          }

          .sidebar {
            grid-area: sidebar;
            background-color: brown;
            padding: 2rem;
          }

          .main-content {
            grid-area: main;
            background-color: brown;
            padding: 2rem;
          }

          .footer {
            grid-area: footer;
            background-color: brown;
            padding: 2rem;
          }
        
</style>
</head>
<body>
    <div class="page-layout">
            <header class="header">Header</header>
            <aside class="sidebar">Sidebar</aside>
            <main class="main-content">Main Content</main>
            <footer class="footer">Footer</footer>
          </div>
</body>
</html>
